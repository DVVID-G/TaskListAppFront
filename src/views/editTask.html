<div class="login-page" style="flex: 1 1 auto; min-height: 0;">
  <header class="login-header header-logo-wrapper">
    <img src="/logo.png" alt="Tasklistapp Logo" class="app-logo" />
  </header>
  <main class="kanban-main" style="flex: 1 1 auto; width:100%; display:flex; justify-content:center;">
  <!-- Top back link removed per design request -->
  <div class="login-card">
    <h2 style="margin-top:0">Editar tarea</h2>

    <form id="editTaskForm" class="form" autocomplete="off" novalidate>
      <div class="row center-row">
  <label for="title" class="label-login">Título de la actividad</label>
        <div class="input-wrap">
          <input id="title" name="title" type="text" required minlength="2" placeholder="Ej: Terminar proyecto" />
        </div>
        <small class="error-msg" id="titleError"></small>
      </div>

      <div class="row center-row">
  <label for="description" class="label-login">Descripción</label>
        <div class="input-wrap">
          <textarea id="description" name="description" required minlength="2" placeholder="Describe la tarea..."></textarea>
        </div>
        <small class="error-msg" id="descriptionError"></small>
      </div>
      
      <div class="row center-row">
  <label for="expectedDate" class="label-login">Fecha límite</label>
        <div class="input-wrap">
          <input id="expectedDate" name="expectedDate" type="date" required />
        </div>
        <small class="error-msg" id="expectedDateError"></small>
      </div>

      <div class="row center-row">
        <label for="status" class="label-login">Estado de la actividad</label>
        <div class="input-wrap">
          <select id="status" name="status" required>
            <option value="Por hacer">Por hacer</option>
            <option value="En progreso">En progreso</option>
            <option value="Completada">Completada</option>
          </select>
        </div>
        <small class="error-msg" id="statusError"></small>
      </div>

      <!-- Hidden user id (populated by JS) -->
      <input type="hidden" id="user" name="user" />

      <div class="row">
        <button id="editTaskBtn" type="submit" class="btn">
          <span id="btnTextEdit">Guardar cambios</span>
          <span id="spinnerEdit" class="spinner" style="display:none;"></span>
        </button>
      </div>

  <p class="back-to-login"><a class="back-board" href="#/board">Volver al tablero</a></p>
      <p id="editTaskMsg"></p>
    </form>
  </div>
  </main>
</div>
