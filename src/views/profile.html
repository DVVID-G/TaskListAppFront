<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Kanbanify</title>
    <link rel="stylesheet" href="/base.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div id="profilePage" class="login-page">
        <!-- Logo arriba -->
        <header class="login-header header-logo-wrapper">
            <img src="/logo.png" alt="Tasklistapp Logo" class="app-logo" />
        </header>

        <!-- Tarjeta principal -->
        <div class="login-card">

            <!-- Botón volver al tablero -->
             <button onclick="goBack()" 
                 class="absolute top-4 left-4 flex items-center text-black bg-gray-700/50 hover:bg-gray-700/80 
                        text-sm px-3 py-1 rounded-lg transition-all duration-300">
               <i data-lucide="arrow-left" class="mr-1 h-4 w-4"></i>
               Volver
             </button>
                
             


            <!-- Título -->
            <h2>Mi Perfil</h2>
            <p class="subtitle">Gestiona tu información personal</p>

            <!-- Avatar -->
            <div class="avatar-section">
                <div class="avatar-circle">
                    <!-- Iniciales o imagen -->
                </div>
                <button id="cameraBtn" class="toggle-pass hidden">
                    <i data-lucide="camera"></i>
                </button>
            </div>

            <!-- Nombre y correo -->
            <h3 id="fullName"></h3>
            <p id="displayEmail"></p>
            <div class="text-sm">
                Miembro desde: <span id="createdDate"></span>
            </div>

            <!-- Formulario editable -->
            <form id="profileForm" class="form" autocomplete="off" novalidate>
                <!-- Nombres -->
                <div class="row">
                    <div class="input-wrap">
                        <input type="text" id="firstName" value="Juan" placeholder="Nombre" class="hidden" />
                        <p id="firstNameDisplay"></p>
                    </div>
                </div>

                <!-- Apellidos -->
                <div class="row">
                    <div class="input-wrap">
                        <input type="text" id="lastName" value="Pérez" placeholder="Apellido" class="hidden" />
                        <p id="lastNameDisplay"></p>
                    </div>
                </div>

                <!-- Email -->
<div class="row">
    <div class="input-wrap">
        <input 
            type="email" 
            id="email" 
            value="juan.perez@email.com" 
            placeholder="Correo electrónico" 
            class="hidden"
        />
        <p id="emailDisplay" class="bg-gray-700/30 text-white px-3 py-1 rounded-lg text-sm">
            juan.perez@email.com
        </p>
    </div>
</div>


                <!-- Botón guardar -->
                <div class="row" id="saveSection" style="display: none;">
                    <button type="button" class="btn" onclick="saveProfile()">
                        <i data-lucide="save"></i> Guardar cambios
                    </button>
                </div>
            </form>

            <!-- Botón editar -->
            <div class="row">
                <button id="editBtn" type="button" class="btn" onclick="toggleEdit()">
                    <span id="editBtnText">Editar</span>
                </button>
            </div>

            <!-- Eliminar cuenta -->
            <div class="row">
                <div class="delete-card">
                    <button class="btn btn-danger" onclick="handleDeleteAccount()">
                        <i data-lucide="x-circle"></i> Eliminar mi cuenta
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isEditing = false;
        lucide.createIcons();

        function toggleEdit() {
            isEditing = !isEditing;
            const editBtnText = document.getElementById('editBtnText');
            const saveSection = document.getElementById('saveSection');
            const cameraBtn = document.getElementById('cameraBtn');
            const fields = ['firstName', 'lastName', 'email'];

            fields.forEach(f => {
                const input = document.getElementById(f);
                const display = document.getElementById(f + 'Display');
                if (isEditing) {
                    input.classList.remove('hidden');
                    display.classList.add('hidden');
                } else {
                    input.classList.add('hidden');
                    display.classList.remove('hidden');
                }
            });

            if (isEditing) {
                editBtnText.textContent = 'Cancelar';
                saveSection.style.display = 'block';
                cameraBtn.classList.remove('hidden');
            } else {
                editBtnText.textContent = 'Editar';
                saveSection.style.display = 'none';
                cameraBtn.classList.add('hidden');
            }
        }

        function goBack() {
            window.history.back();
        }

        function handleDeleteAccount() {
            const confirmDelete = window.confirm("⚠️ ¿Estás seguro de eliminar tu cuenta.Esta acción es permanente. Una vez eliminada, no podrás recuperar tu cuenta ni tus datos.?");
            if (confirmDelete) {
                console.log("Cuenta eliminada (simulación)");
            }
        }
    </script>
    <script type="module" src="/src/js/profile.js"></script>
</body>
</html>
